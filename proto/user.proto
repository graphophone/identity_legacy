syntax = "proto3";

package user;

option go_package = "graphophone.identity/internal/services/common/user";

service UserService {
    rpc RegisterUser(RegisterUserRequest) returns (UserProfile) {}
}

message UserProfile {
    uint32 id = 1;
    string username = 2;
    optional string first_name = 3;
    optional string last_name = 4;
    optional string bio = 5;
    optional string country = 6;
    optional string city = 7;
    optional string avatar_url = 8;
}

message RegisterUserRequest {
    string username = 1;
    string email = 2;
    string password = 3;
    optional string first_name = 4;
    optional string last_name = 5;
}

message GetProfileRequest {
    uint32 user_id = 1;
}

message UpdateProfileRequest {
    string username = 1;
    optional string first_name = 2;
    optional string last_name = 3;
    optional string bio = 4;
    optional string country = 5;
    optional string city = 6;
}

message UpdateUserPasswordRequest {
    string old_password = 1;
    string new_password = 2;
}

message UpdateUserAvatarRequest {
    bytes image = 1;
}

message DeactivateUserProfileRequest {}

message ActivateUserProfileRequest {}