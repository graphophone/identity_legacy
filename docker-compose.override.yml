services:
  redis:
    networks:
      - redis-network

  redis-insight:
    image: redislabs/redisinsight:3.6.0
    container_name: redis-insight
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDISINSIGHT_HOST: "0.0.0.0"
      REDISINSIGHT_ACCEPT_LICENCE: true
    ports:
      - "15540:5540"
    networks:
      - redis-network
    depends_on:
      - redis

networks:
  redis-network:
    driver: bridge